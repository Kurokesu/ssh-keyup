# Live SSH targets for the integration suite

services:
  linux:
    build:
      context: .
      dockerfile: linux.Dockerfile
    ports:
      - "2200:22"

  # One network and the entrypoint bridges eth0, breaking host port mapping
  ros7:
    image: evilfreelancer/docker-routeros:7.21.5
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/kvm
    ports:
      - "2207:22"
    networks:
      # Published port forwards to the default address, so it has to be eth0.
      # Priority pins that, otherwise attach order decides which one survives.
      default:
        priority: 100
      routeros:
        priority: 0

networks:
  routeros:
    driver: bridge
