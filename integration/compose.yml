# Live SSH targets for the integration suite

services:
  linux:
    build:
      context: .
      dockerfile: linux.Dockerfile
    ports:
      - "2200:22"

  # One network and the entrypoint bridges eth0, breaking host port mapping
  ros7:
    image: evilfreelancer/docker-routeros:7.21.5
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/kvm
    ports:
      - "2207:22"
    networks:
      - default
      - routeros

networks:
  routeros:
    driver: bridge
