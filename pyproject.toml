[build-system]
requires = ["setuptools>=40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

# tool tables are ignored by setuptools, safe next to setup.cfg metadata
[tool.ruff]
line-length = 79
# match python_requires, keeps fixes runtime safe on old Pythons
target-version = "py38"

[tool.pytest.ini_options]
# plain pytest runs unit tests only
addopts = "-m 'not integration'"
markers = ["integration: drives a live SSH target"]
