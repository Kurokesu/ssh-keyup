[metadata]
name = ssh-keyup
version = attr: ssh_keyup.__version__
description = Passwordless SSH from Windows or Linux to Raspberry Pi, NVIDIA Jetson, MikroTik routers and other Linux or RouterOS devices. One command, no ssh-copy-id needed
long_description = file: README.md
long_description_content_type = text/markdown
author = UAB Kurokesu
license = GPL-3.0-or-later
license_files = LICENSE
url = https://github.com/Kurokesu/ssh-keyup
project_urls =
    Repository = https://github.com/Kurokesu/ssh-keyup
    Issues = https://github.com/Kurokesu/ssh-keyup/issues
    Changelog = https://github.com/Kurokesu/ssh-keyup/releases
keywords = ssh, ssh-keys, ssh-config, ssh-copy-id, passwordless-ssh, openssh, ed25519, raspberry-pi, rpi, jetson, mikrotik, routeros, iot, automation, vscode, remote-ssh, windows, linux
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: System :: Networking
    Topic :: System :: Systems Administration
    Topic :: Utilities

[options]
py_modules = ssh_keyup
python_requires = >=3.8

[options.entry_points]
console_scripts =
    ssh-keyup = ssh_keyup:main
